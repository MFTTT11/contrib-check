[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contrib-check"
version = "0.3.0"
description = "Check an open-source issue before contributing: competing PRs, claims, already-done remarks, bounty labels, repo activity."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
contrib-check = "contrib_check.__main__:main"

[tool.setuptools]
packages = ["contrib_check"]
