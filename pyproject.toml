[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bounty-scout"
version = "0.1.0"
description = "Check whether an open-source bounty is still worth working on: competition, assignment, repo activity."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
bounty-scout = "bounty_scout.__main__:main"

[tool.setuptools]
packages = ["bounty_scout"]
