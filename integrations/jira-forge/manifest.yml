modules:
  jira:issuePanel:
    - key: work-check-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Work check
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:jira-work
  external:
    fetch:
      backend:
        - api.github.com
app:
  runtime:
    name: nodejs22.x
  # Replaced by `forge register` with the app id of your own Atlassian developer account.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
